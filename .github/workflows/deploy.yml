name: Build and Deploy to EKS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ secrets.AWS_REGION }} --name ${{ secrets.EKS_CLUSTER_NAME }}

      - name: Create .env file from secrets and sync to Kubernetes
        run: |
          echo "PORT=${{ secrets.PORT || '3001' }}" > .env
          echo "NODE_ENV=production" >> .env
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env
          echo "AZURE_STORAGE_CONNECTION_STRING=${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" >> .env
          echo "AZURE_STORAGE_CONTAINER=${{ secrets.AZURE_STORAGE_CONTAINER || 'uploads' }}" >> .env
          echo "AZURE_VISION_ENDPOINT=${{ secrets.AZURE_VISION_ENDPOINT }}" >> .env
          echo "AZURE_VISION_KEY=${{ secrets.AZURE_VISION_KEY }}" >> .env

          kubectl create secret generic plaiss-api-secrets \
            --from-env-file=.env \
            --namespace=dev \
            --dry-run=client -o yaml | kubectl apply -f -

          rm -f .env

      - name: Deploy to EKS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kubectl set image deployment/plaiss-api plaiss-api=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -n dev
          kubectl rollout status deployment/plaiss-api -n dev --timeout=120s

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed - rolling back to previous version"
          kubectl rollout undo deployment/plaiss-api -n dev
          kubectl rollout status deployment/plaiss-api -n dev --timeout=60s
          echo "Rollback complete"
