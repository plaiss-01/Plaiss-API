name: Build and Deploy to Azure Container Apps

# Production deploys come from `azure-migration` ONLY.
#
# This file used to list `main` here as well. Because GitHub Actions runs the
# workflow from whichever branch was pushed, that meant a push to `main` and a
# push to `azure-migration` both deployed to the same Container App, and
# whichever landed last became production. The two branches are not supersets
# of each other, so production kept flipping between them — a push to `main`
# would silently drop the pg_trgm index bootstrap (sofa pages time out), the
# base_sku colour dedup, and the category-term fixes that live on
# `azure-migration`.
#
# `main` is therefore no longer a deploying branch. Merge into
# `azure-migration` to release. Please check with the Plaiss maintainers before
# changing this back.
on:
  push:
    branches:
      - azure-migration

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push image to ACR
        run: |
          az acr build \
            --registry acrplaissuk \
            --image plaiss-api:${{ github.sha }} \
            --file Dockerfile \
            .

      - name: Get image digest
        id: digest
        run: |
          DIGEST=$(az acr repository show-manifests \
            --name acrplaissuk \
            --repository plaiss-api \
            --orderby time_desc \
            --top 1 \
            --query "[0].digest" \
            --output tsv)
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

      - name: Deploy new revision to Container App
        run: |
          az containerapp update \
            --name plaiss-api \
            --resource-group rg-plaiss-uk \
            --image acrplaissuk.azurecr.io/plaiss-api@${{ steps.digest.outputs.digest }} \
            --revision-suffix gh-${{ github.run_number }}
