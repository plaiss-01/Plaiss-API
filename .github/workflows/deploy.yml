name: Build and Deploy to Azure Container Apps

on:
  push:
    branches:
      - azure-migration

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push image to ACR
        run: |
          az acr build \
            --registry acrplaissuk \
            --image plaiss-api:${{ github.sha }} \
            --file Dockerfile \
            .

      - name: Get image digest
        id: digest
        run: |
          DIGEST=$(az acr repository show-manifests \
            --name acrplaissuk \
            --repository plaiss-api \
            --orderby time_desc \
            --top 1 \
            --query "[0].digest" \
            --output tsv)
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

      - name: Deploy new revision to Container App
        run: |
          az containerapp update \
            --name plaiss-api \
            --resource-group rg-plaiss-uk \
            --image acrplaissuk.azurecr.io/plaiss-api@${{ steps.digest.outputs.digest }} \
            --revision-suffix gh-${{ github.run_number }}
